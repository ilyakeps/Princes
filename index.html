function compileSprite(rows) {
  const h = rows.length;
  const w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const col = SPRITE_PAL[rows[y][x]];
      if (col) {
        cx.fillStyle = col;
        cx.fillRect(x, y, 1, 1);
      }
    }
  }
  return c;
}

// Звук входа в трубу — нисходящая глиссандо
function playPipeSwoosh() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(800, t);
  osc.frequency.exponentialRampToValueAtTime(200, t + 0.5);
  gain.gain.setValueAtTime(0.07, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.5);
}

function playWinFanfare() {
  if (!audioCtx) return;
  let t = audioCtx.currentTime;
  for (const note of WIN_FANFARE) {
    if (note.f > 0) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = note.w || 'square';
      osc.frequency.value = note.f;
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + note.d);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + note.d);
    }
    t += note.d;
  }
}

function playStep() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = 130;
  gain.gain.setValueAtTime(CONFIG.stepVolume, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.04);
}

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(name) {
  if (!audioCtx || !SOUNDS[name]) return;
  let t = audioCtx.currentTime;
  for (const note of SOUNDS[name]) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = note.w || 'square';
    osc.frequency.value = note.f;
    gain.gain.setValueAtTime(0.07, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + note.d);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + note.d);
    t += note.d;
  }
}

let musicState = {
  current: null,
  melody: { nextNoteTime: 0, noteIndex: 0 },
  bass:   { nextNoteTime: 0, noteIndex: 0 },
  melodyGain: null,
  bassGain: null,
  playing: false,
  schedulerTimer: null,
};

function startMusic(trackName) {
  if (!audioCtx) return;
  if (musicState.current === trackName && musicState.playing) return;

  stopMusic();

  const track = MUSIC[trackName];
  if (!track) return;

  musicState.melodyGain = audioCtx.createGain();
  musicState.melodyGain.gain.value = CONFIG.musicVolume;
  musicState.melodyGain.connect(audioCtx.destination);

  musicState.bassGain = audioCtx.createGain();
  musicState.bassGain.gain.value = CONFIG.musicVolume * 0.6;
  musicState.bassGain.connect(audioCtx.destination);

  musicState.current = trackName;
  musicState.melody.noteIndex = 0;
  musicState.melody.nextNoteTime = audioCtx.currentTime + 0.1;
  musicState.bass.noteIndex = 0;
  musicState.bass.nextNoteTime = audioCtx.currentTime + 0.1;
  musicState.playing = true;

  scheduleMusic();
}

function stopMusic() {
  if (musicState.schedulerTimer) {
    clearTimeout(musicState.schedulerTimer);
    musicState.schedulerTimer = null;
  }
  if (musicState.melodyGain) {
    try { musicState.melodyGain.disconnect(); } catch(e) {}
  }
  if (musicState.bassGain) {
    try { musicState.bassGain.disconnect(); } catch(e) {}
  }
  musicState.playing = false;
  musicState.current = null;
  musicState.melodyGain = null;
  musicState.bassGain = null;
}

function scheduleMusic() {
  if (!musicState.playing || !audioCtx) return;
  const track = MUSIC[musicState.current];
  if (!track) return;

  const horizon = audioCtx.currentTime + 0.4;

  // Мелодия
  if (track.melody && track.melody.length > 0) {
    while (musicState.melody.nextNoteTime < horizon) {
      const note = track.melody[musicState.melody.noteIndex];
      if (note.f > 0) {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = note.f;
        env.gain.setValueAtTime(0, musicState.melody.nextNoteTime);
        env.gain.linearRampToValueAtTime(1.0, musicState.melody.nextNoteTime + 0.01);
        env.gain.linearRampToValueAtTime(0.7, musicState.melody.nextNoteTime + note.d * 0.7);
        env.gain.linearRampToValueAtTime(0, musicState.melody.nextNoteTime + note.d * 0.95);
        osc.connect(env);
        env.connect(musicState.melodyGain);
        osc.start(musicState.melody.nextNoteTime);
        osc.stop(musicState.melody.nextNoteTime + note.d);
      }
      musicState.melody.nextNoteTime += note.d;
      musicState.melody.noteIndex = (musicState.melody.noteIndex + 1) % track.melody.length;
    }
  }

  // Бас
  if (track.bass && track.bass.length > 0) {
    while (musicState.bass.nextNoteTime < horizon) {
      const note = track.bass[musicState.bass.noteIndex];
      if (note.f > 0) {
        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = note.f;
        env.gain.setValueAtTime(0, musicState.bass.nextNoteTime);
        env.gain.linearRampToValueAtTime(1.0, musicState.bass.nextNoteTime + 0.02);
        env.gain.linearRampToValueAtTime(0.6, musicState.bass.nextNoteTime + note.d * 0.7);
        env.gain.linearRampToValueAtTime(0, musicState.bass.nextNoteTime + note.d * 0.95);
        osc.connect(env);
        env.connect(musicState.bassGain);
        osc.start(musicState.bass.nextNoteTime);
        osc.stop(musicState.bass.nextNoteTime + note.d);
      }
      musicState.bass.nextNoteTime += note.d;
      musicState.bass.noteIndex = (musicState.bass.noteIndex + 1) % track.bass.length;
    }
  }

  musicState.schedulerTimer = setTimeout(scheduleMusic, 200);
}

   КОНЕЦ ЧАСТИ 3. Далее — генерация уровня (часть 4/6).

/* =========================================================
   4. УРОВЕНЬ — ГЕНЕРАЦИЯ
   ========================================================= */

const T = {
  EMPTY: 0,
  GROUND: 1,
  BRICK: 2,
  QUESTION: 3,
  PIPE_TL: 4, PIPE_TR: 5, PIPE_BL: 6, PIPE_BR: 7,
  PIPE_IN_TL: 8, PIPE_IN_TR: 9, PIPE_IN_BL: 10, PIPE_IN_BR: 11,
};

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function isPipeTile(t) {
  return t === T.PIPE_TL || t === T.PIPE_TR || t === T.PIPE_BL || t === T.PIPE_BR;
}
function isPipeInTile(t) {
  return t === T.PIPE_IN_TL || t === T.PIPE_IN_TR || t === T.PIPE_IN_BL || t === T.PIPE_IN_BR;
}

function generateLevel(seed, isUnderground, difficulty) {
  const rng = mulberry32(seed);
  const W = 110 + Math.floor(difficulty * 12);
  const H = 16;
  const grid = [];
  for (let y = 0; y < H; y++) grid.push(new Array(W).fill(T.EMPTY));

  const groundY = H - 2;
  const groundTopY = groundY - 1;
  const ceilingY = isUnderground ? 2 : 0;

  if (isUnderground) {
    for (let x = 0; x < W; x++) {
      grid[0][x] = T.GROUND;
      grid[1][x] = T.GROUND;
    }
  }

  // 1. Земля и ямы (между ямами — минимум 2 тайла земли)
  const pitMap = new Array(W).fill(false);
  let x = 0;
  let groundAfterPit = 2;
  while (x < W) {
    const gapChance = 0.05 + difficulty * 0.008;
    const canPlacePit = x > 12 && x < W - 12 && groundAfterPit >= 2;
    if (canPlacePit && rng() < gapChance) {
      const gapW = 2 + Math.floor(rng() * 2);
      for (let i = 0; i < gapW && x < W; i++, x++) {
        pitMap[x] = true;
      }
      groundAfterPit = 0;
    } else {
      grid[groundY][x] = T.GROUND;
      grid[groundY + 1][x] = T.GROUND;
      x++;
      groundAfterPit++;
    }
  }

  function nearPit(tx) {
    const r = CONFIG.pitClearSide;
    for (let d = -r; d <= r; d++) {
      const xx = tx + d;
      if (xx >= 0 && xx < W && pitMap[xx]) return true;
    }
    return false;
  }

  function isPit(tx) {
    return tx >= 0 && tx < W && pitMap[tx];
  }

  for (let i = 0; i < 3 + difficulty; i++) {
    const px = 15 + Math.floor(rng() * (W - 30));
    const ph = 1 + Math.floor(rng() * 2);
    for (let h = 0; h < ph; h++) {
      const yy = groundY - 1 - h;
      if (yy >= ceilingY + 2) {
        grid[yy][px] = T.GROUND;
        if (px + 1 < W) grid[yy][px + 1] = T.GROUND;
      }
    }
  }

  // 2. Трубы
  const pipeZones = [];
  const enemies = [];
  const coins = [];

  function canPlacePipeAt(px, height) {
    if (px < 5 || px + 1 >= W - 5) return false;
    for (let g = 0; g < 2; g++) {
      if (grid[groundY][px + g] !== T.GROUND) return false;
      if (nearPit(px + g)) return false;
    }
    for (let h = 0; h < height; h++) {
      const y = groundTopY - h;
      if (y < ceilingY + 1) return false;
      if (grid[y][px] !== T.EMPTY) return false;
      if (grid[y][px + 1] !== T.EMPTY) return false;
    }
    for (const zone of pipeZones) {
      if (!(px + 1 < zone.x1 - 2 || px > zone.x2 + 2)) return false;
    }
    return true;
  }

  function registerPipeZone(px, height) {
    pipeZones.push({
      x1: px, x2: px + 1,
      yTop: groundTopY - height,
      yBottom: groundTopY,
    });
  }

  function placePipe(px, height, isEntry) {
    for (let h = 0; h < height; h++) {
      const y = groundTopY - h;
      const isTopRow = (h === height - 1);
      if (isEntry) {
        grid[y][px]     = isTopRow ? T.PIPE_IN_TL : T.PIPE_IN_BL;
        grid[y][px + 1] = isTopRow ? T.PIPE_IN_TR : T.PIPE_IN_BR;
      } else {
        grid[y][px]     = isTopRow ? T.PIPE_TL : T.PIPE_BL;
        grid[y][px + 1] = isTopRow ? T.PIPE_TR : T.PIPE_BR;
      }
    }
    registerPipeZone(px, height);
  }

  if (!isUnderground) {
    let placed = false;
    for (let tries = 0; tries < 50 && !placed; tries++) {
      const px = 15 + Math.floor(rng() * (W - 40));
      const height = CONFIG.pipeMinHeight + Math.floor(rng() * (CONFIG.pipeMaxHeight - CONFIG.pipeMinHeight + 1));
      if (canPlacePipeAt(px, height)) {
        placePipe(px, height, true);
        placed = true;
      }
    }
  }

  const extraPipes = 1 + Math.floor(difficulty / 2);
  for (let i = 0; i < extraPipes; i++) {
    let placed = false;
    for (let tries = 0; tries < 30 && !placed; tries++) {
      const px = 25 + Math.floor(rng() * (W - 55));
      const height = CONFIG.pipeMinHeight + Math.floor(rng() * (CONFIG.pipeMaxHeight - CONFIG.pipeMinHeight + 1));
      if (!canPlacePipeAt(px, height)) continue;
      const isFlower = rng() < 0.7;
      placePipe(px, height, false);
      if (isFlower) {
        enemies.push({
          type: 'flower',
          x: px + 1,
          y: groundTopY - height,
          pipeX1: px,
          pipeX2: px + 1,
          pipeTopY: groundTopY - height,
          timer: Math.floor(rng() * 180),
        });
      }
      placed = true;
    }
  }

  function inPipeForbidden(tx, ty) {
    for (const z of pipeZones) {
      const sideL = z.x1 - CONFIG.pipeClearSide;
      const sideR = z.x2 + CONFIG.pipeClearSide;
      const topClear = z.yTop - CONFIG.pipeClearAbove;
      if (tx >= sideL && tx <= sideR && ty >= topClear && ty <= z.yBottom) return true;
    }
    return false;
  }

  // 3. Платформы
  const platformsCount = 4 + difficulty;
  for (let i = 0; i < platformsCount; i++) {
    let placed = false;
    for (let tries = 0; tries < 25 && !placed; tries++) {
      let px = 20 + Math.floor(rng() * (W - 40));
      const pw = 3 + Math.floor(rng() * 3);
      const pyMin = isUnderground ? ceilingY + 4 : Math.max(4, groundTopY - CONFIG.maxJumpHeight);
      const pyMax = groundTopY - 3;
      if (pyMin > pyMax) continue;
      const py = pyMin + Math.floor(rng() * (pyMax - pyMin + 1));

      function collidesPit(startX) {
        for (let j = 0; j < pw; j++) {
          const tx = startX + j;
          if (tx < 0 || tx >= W) return true;
          if (nearPit(tx)) return true;
        }
        return false;
      }

      let attempts = 0;
      while (collidesPit(px) && attempts < 20) {
        if (px > 5 && !collidesPit(px - 1)) { px -= 1; }
        else if (px + pw + 1 < W - 5 && !collidesPit(px + 1)) { px += 1; }
        else { break; }
        attempts++;
      }
      if (collidesPit(px)) continue;

      let pipeConflict = false;
      for (let j = 0; j < pw; j++) {
        if (inPipeForbidden(px + j, py)) { pipeConflict = true; break; }
      }
      if (pipeConflict) continue;
      if (py <= ceilingY + 1) continue;

      for (let j = 0; j < pw; j++) {
        const tx = px + j;
        if (grid[py][tx] === T.EMPTY) {
          grid[py][tx] = rng() < 0.6 ? T.BRICK : T.QUESTION;
        }
      }

      if (rng() < 0.55) {
        coins.push({ x: px + Math.floor(pw / 2), y: py - 2 });
      }
      if (rng() < 0.48) {
        const ex = px + Math.floor(pw / 2);
        if (!inPipeForbidden(ex, py - 1) && !nearPit(ex)) {
          enemies.push({
            type: rng() < 0.5 ? 'walker' : 'jumper',
            x: ex,
            y: py - 1,
            dir: rng() < 0.5 ? 1 : -1,
            platform: { minX: px, maxX: px + pw - 1, y: py },
          });
        }
      }

      const heightAboveGround = groundTopY - py;
      if (heightAboveGround > 2) {
        const stepCount = Math.min(2, heightAboveGround - 1);
        for (let s = 0; s < stepCount; s++) {
          const stepY = groundTopY - (s + 1);
          const stepX = px - (stepCount - s);
          if (stepX > 5 && stepX < W - 2 &&
              grid[stepY][stepX] === T.EMPTY &&
              !inPipeForbidden(stepX, stepY) &&
              !nearPit(stepX)) {
            grid[stepY][stepX] = T.BRICK;
          }
        }
      }
      placed = true;
    }
  }

  // 4. Одиночные блоки
  for (let i = 0; i < 10 + difficulty * 2; i++) {
    const px = 10 + Math.floor(rng() * (W - 20));
    const pyMin = groundTopY - CONFIG.maxJumpHeight;
    const pyMax = groundTopY - 3;
    if (pyMin > pyMax) continue;
    const py = pyMin + Math.floor(rng() * (pyMax - pyMin + 1));
    if (grid[py][px] === T.EMPTY &&
        !inPipeForbidden(px, py) &&
        !nearPit(px)) {
      grid[py][px] = rng() < 0.65 ? T.BRICK : T.QUESTION;
    }
  }

  // 5. Враги на земле (+20%)
  const groundEnemies = Math.round((2 + difficulty) * 1.2);
  for (let i = 0; i < groundEnemies; i++) {
    const px = 20 + Math.floor(rng() * (W - 40));
    if (grid[groundTopY][px] === T.EMPTY &&
        grid[groundY][px] === T.GROUND &&
        !inPipeForbidden(px, groundTopY) &&
        !nearPit(px)) {
      enemies.push({
        type: rng() < 0.7 ? 'walker' : 'jumper',
        x: px,
        y: groundTopY,
        dir: rng() < 0.5 ? 1 : -1,
      });
    }
  }

  // ---- 6. МОНЕТЫ — УЗОРЫ ----
  // Доступные узоры: линия, дуга, круг, ромб, пара.
  // Каждый узор проверяет, что все монеты в достижимых пустых тайлах.

  function canPlaceCoinAt(cx, cy) {
    if (cx < 0 || cx >= W || cy < 0 || cy >= H) return false;
    if (grid[cy][cx] !== T.EMPTY) return false;
    if (inPipeForbidden(cx, cy)) return false;
    // Не над ямой и не над ней ±1
    if (nearPit(cx)) return false;
    return true;
  }

  function placePattern(kind, cx, cy) {
    const pattern = [];
    if (kind === 'line') {
      // 4-6 монет в ряд
      const n = 4 + Math.floor(rng() * 3);
      for (let i = 0; i < n; i++) pattern.push([cx + i, cy]);
    } else if (kind === 'arc') {
      // Дуга над ямой: 5 монет по параболе
      pattern.push([cx - 2, cy + 1]);
      pattern.push([cx - 1, cy]);
      pattern.push([cx, cy - 1]);
      pattern.push([cx + 1, cy]);
      pattern.push([cx + 2, cy + 1]);
    } else if (kind === 'circle') {
      // Круг: 6-8 монет вокруг центра
      const r = 2;
      const angles = [0, 60, 120, 180, 240, 300];
      for (const a of angles) {
        const rad = a * Math.PI / 180;
        pattern.push([cx + Math.round(Math.cos(rad) * r), cy + Math.round(Math.sin(rad) * r)]);
      }
    } else if (kind === 'diamond') {
      // Ромб: 4 монеты
      pattern.push([cx, cy - 1]);
      pattern.push([cx - 1, cy]);
      pattern.push([cx + 1, cy]);
      pattern.push([cx, cy + 1]);
    } else if (kind === 'pair') {
      pattern.push([cx, cy]);
      pattern.push([cx + 1, cy]);
    }
    return pattern;
  }

  const patternKinds = ['line', 'arc', 'circle', 'diamond', 'pair'];
  const coinPatterns = 3 + Math.floor(difficulty / 2);

  for (let i = 0; i < coinPatterns; i++) {
    const kind = patternKinds[Math.floor(rng() * patternKinds.length)];
    let attempts = 0;
    let placedOk = false;
    while (attempts < 15 && !placedOk) {
      const cx = 15 + Math.floor(rng() * (W - 30));
      // Высота узора: чуть выше земли или на уровне платформ
      let cy;
      if (kind === 'arc') {
        // Дуга над ямой — на уровне земли или чуть выше
        cy = groundTopY - 2;
      } else if (kind === 'circle') {
        cy = groundTopY - 4 + Math.floor(rng() * 2);
      } else {
        cy = groundTopY - 1 - Math.floor(rng() * 3);
      }

      const pattern = placePattern(kind, cx, cy);
      let allOk = true;
      for (const [px, py] of pattern) {
        if (!canPlaceCoinAt(px, py)) { allOk = false; break; }
      }
      if (allOk) {
        for (const [px, py] of pattern) {
          coins.push({ x: px, y: py });
        }
        placedOk = true;
      }
      attempts++;
    }
  }

  // Одиночные монеты на земле (небольшое количество для «добивки»)
  for (let i = 0; i < 4; i++) {
    const px = 15 + Math.floor(rng() * (W - 30));
    if (grid[groundTopY][px] === T.EMPTY &&
        grid[groundY][px] === T.GROUND &&
        !inPipeForbidden(px, groundTopY) &&
        !nearPit(px)) {
      coins.push({ x: px, y: groundTopY });
    }
  }

  // 7. Декорации — детерминированные по seed
  const decorSeed = mulberry32(seed + 9999);
  const decor = {
    mountains: [],
    trees: [],
    bushes: [],
  };
  for (let i = 0; i < Math.floor(W / 20); i++) {
    decor.mountains.push({
      x: i * 20 + Math.floor(decorSeed() * 8),
      size: 4 + Math.floor(decorSeed() * 4),
    });
  }
  for (let i = 0; i < Math.floor(W / 15); i++) {
    decor.trees.push({
      x: i * 15 + Math.floor(decorSeed() * 6),
    });
  }
  for (let i = 0; i < Math.floor(W / 12); i++) {
    decor.bushes.push({
      x: i * 12 + Math.floor(decorSeed() * 5),
    });
  }

  return {
    grid, W, H, groundY, groundTopY, ceilingY,
    enemies, coins, items: [],
    flagX: W - 6,
    isUnderground,
    pipeZones,
    pitMap,
    decor,
  };
}

/* =========================================================
   КОНЕЦ ЧАСТИ 4. Далее — состояние, ввод, логика (часть 5/6).
   ========================================================= */
/* =========================================================
   5. СОСТОЯНИЕ
   ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let CW = 0, CH = 0;

function resize() {
  // Берём размеры ОКНА напрямую, без DPR — canvas растянется через CSS
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  CW = Math.floor(vw);
  CH = Math.floor(vh);

  // Ставим canvas ровно по размеру окна — CSS сам растянет
  canvas.style.position = 'fixed';
  canvas.style.top = '0';
  canvas.style.left = '0';
  canvas.style.width = CW + 'px';
  canvas.style.height = CH + 'px';

  // Внутренняя буферизация canvas — 1:1 с CSS (без DPR)
  canvas.width = CW;
  canvas.height = CH;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;

  // ★ ЕДИНСТВЕННАЯ НОВАЯ СТРОКА: адаптивный размер тайла
  // Уровень = 16 тайлов по высоте. Считаем, сколько пикселей на тайл,
  // чтобы всё влезло в экран. Ограничиваем: минимум 16, максимум 32.
  CONFIG.tileSize = Math.max(24, Math.min(32, Math.floor(CH / 15)));

  setupButtons();
}

const game = {
  state: 'title',
  hero: 'blue',
  level: null,
  levelIndex: 0,
  lives: 3,
  score: 0,
  coins: 0,
  cameraX: 0,
  timer: 0,
  fireworks: [],
  particles: [],
  transitionTimer: 0,
  bonusLevel: null,
  bonusReturn: null,
  keepIsBig: false,
  keepHasFire: false,
  flagDone: false,
  lastStepSound: 0,
};

const player = {
  x: 3, y: 10,
  vx: 0, vy: 0,
  w: 0.75, h: 0.95,
  onGround: false,
  facing: 1,
  isBig: false,
  hasFire: false,
  isStar: false,
  starTimer: 0,
  invuln: 0,
  jumpHoldTimer: 0,
  isJumping: false,
  animTimer: 0,
  bobTimer: 0,
  dustTimer: 0,
  dead: false,
  fireballs: [],
  enteringPipe: null,
  exitTimer: 0,
  pipeLockTimer: 0,
};

/* =========================================================
   6. ВВОД
   ========================================================= */

const input = {
  left: false, right: false, up: false, down: false,
  jump: false, fire: false,
  jumpPressed: false,
  firePressed: false,
};

const keys = {};
window.addEventListener('keydown', e => {
  if (e.repeat) { e.preventDefault(); return; }
  keys[e.key] = true;
  initAudio();
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
    if (!input.jump) input.jumpPressed = true;
  }
  if (e.key === 'x' || e.key === 'X') {
    if (!input.fire) input.firePressed = true;
  }
  updateKeys();
  e.preventDefault();
}, { passive: false });

window.addEventListener('keyup', e => {
  keys[e.key] = false;
  updateKeys();
});

function updateKeys() {
  input.left = !!(keys['ArrowLeft'] || keys['a']);
  input.right = !!(keys['ArrowRight'] || keys['d']);
  input.up = !!(keys['ArrowUp'] || keys['w']);
  input.down = !!(keys['ArrowDown'] || keys['s']);
  input.jump = !!(keys[' '] || keys['ArrowUp'] || keys['w']);
  input.fire = !!(keys['x'] || keys['X']);
}

const buttons = [];
function setupButtons() {
  buttons.length = 0;
  const bw = Math.min(110, CW / 7);
  const pad = 12;
  const bottom = CH - bw - pad;
  buttons.push({ id: 'left',  x: pad,               y: bottom,          w: bw, h: bw });
  buttons.push({ id: 'right', x: pad + bw + 8,      y: bottom,          w: bw, h: bw });
  buttons.push({ id: 'down',  x: pad,               y: bottom - bw - 8, w: bw, h: bw });
  buttons.push({ id: 'up',    x: pad + bw + 8,      y: bottom - bw - 8, w: bw, h: bw });
  buttons.push({ id: 'fire',  x: CW - pad - bw*1.5 - 8, y: bottom,       w: bw*1.5, h: bw });
  buttons.push({ id: 'jump',  x: CW - pad - bw*1.5,     y: bottom - bw - 8, w: bw*1.5, h: bw });
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => {
  setTimeout(resize, 50);
  setTimeout(resize, 200);
  setTimeout(resize, 500);
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}

const activeTouches = {};

function pointInBtn(px, py, b) {
  return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
}

function handleTouchStart(e) {
  initAudio();
  for (const t of e.changedTouches) {
    const px = t.clientX, py = t.clientY;
    if (game.state === 'title') { handleTitleTap(px, py); continue; }
    if (game.state === 'gameWin' || game.state === 'levelComplete') {
      if (px > CW/2 - 200 && px < CW/2 + 200 && py > CH/2 + 40 && py < CH/2 + 140) {
        advanceFromOverlay();
      }
      continue;
    }
    for (const b of buttons) {
      if (pointInBtn(px, py, b)) {
        activeTouches[t.identifier] = b.id;
        if (b.id === 'jump') input.jumpPressed = true;
        if (b.id === 'fire') input.firePressed = true;
        applyBtn(b.id, true);
      }
    }
  }
  e.preventDefault();
}

function handleTouchMove(e) {
  for (const t of e.changedTouches) {
    const px = t.clientX, py = t.clientY;
    const prev = activeTouches[t.identifier];
    let now = null;
    for (const b of buttons) {
      if (pointInBtn(px, py, b)) { now = b.id; break; }
    }
    if (prev !== now) {
      if (prev) applyBtn(prev, false);
      if (now) {
        applyBtn(now, true);
        if (now === 'jump') input.jumpPressed = true;
        if (now === 'fire') input.firePressed = true;
      }
      if (now) activeTouches[t.identifier] = now;
      else delete activeTouches[t.identifier];
    }
  }
  e.preventDefault();
}

function handleTouchEnd(e) {
  for (const t of e.changedTouches) {
    const prev = activeTouches[t.identifier];
    if (prev) applyBtn(prev, false);
    delete activeTouches[t.identifier];
  }
  e.preventDefault();
}

function applyBtn(id, down) {
  if (id === 'left') input.left = down;
  else if (id === 'right') input.right = down;
  else if (id === 'up') input.up = down;
  else if (id === 'down') input.down = down;
  else if (id === 'jump') input.jump = down;
  else if (id === 'fire') input.fire = down;
}

canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

canvas.addEventListener('mousedown', e => {
  initAudio();
  const px = e.clientX, py = e.clientY;
  if (game.state === 'title') { handleTitleTap(px, py); return; }
  if (game.state === 'gameWin' || game.state === 'levelComplete') {
    if (px > CW/2 - 200 && px < CW/2 + 200 && py > CH/2 + 40 && py < CH/2 + 140) {
      advanceFromOverlay();
    }
    return;
  }
  for (const b of buttons) {
    if (pointInBtn(px, py, b)) {
      applyBtn(b.id, true);
      if (b.id === 'jump') input.jumpPressed = true;
      if (b.id === 'fire') input.firePressed = true;
    }
  }
});
canvas.addEventListener('mouseup', () => {
  applyBtn('left', false); applyBtn('right', false);
  applyBtn('up', false); applyBtn('down', false);
  applyBtn('jump', false); applyBtn('fire', false);
});

/* ---- FULLSCREEN ---- */

function goFullscreen() {
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) {
      el.requestFullscreen().catch(() => {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else if (el.mozRequestFullScreen) {
      el.mozRequestFullScreen();
    } else if (el.msRequestFullscreen) {
      el.msRequestFullscreen();
    }
  } catch (e) { /* игнорируем */ }

  // Костыль для iPhone Safari: спрятать адресную строку
  setTimeout(() => {
    try { window.scrollTo(0, 1); } catch (e) {}
  }, 100);
}

let fullscreenRequested = false;
function ensureFullscreenAndAudio() {
  initAudio();
  if (!fullscreenRequested) {
    fullscreenRequested = true;
    goFullscreen();
  }
}

window.addEventListener('touchstart', ensureFullscreenAndAudio, { once: false, passive: true });
window.addEventListener('mousedown', ensureFullscreenAndAudio, { once: false });

/* =========================================================
   7. ЛОГИКА
   ========================================================= */

function startGame(heroKey) {
  game.hero = heroKey;
  game.levelIndex = 0;
  game.lives = 3;
  game.score = 0;
  game.coins = 0;
  game.keepIsBig = false;
  game.keepHasFire = false;
  game.state = 'playing';
  game.bonusLevel = null;
  game.bonusReturn = null;
  loadLevel(0);
}

function loadLevel(idx, keepPowerups) {
  const seed = Math.floor(Math.random() * 1e9);
  const underground = idx % 2 === 1;
  const difficulty = Math.floor(idx / 2);
  game.level = generateLevel(seed, underground, difficulty);
  game.levelIndex = idx;
  resetPlayer(keepPowerups);
  game.timer = 0;
  game.fireworks = [];
  game.particles = [];
  game.flagDone = false;

  if (underground) startMusic('underground');
  else startMusic('ground');
}

function resetPlayer(keepPowerups) {
  player.x = 3;
  player.y = game.level.groundY - 2;
  player.vx = 0; player.vy = 0;
  player.onGround = false;
  player.dead = false;
  if (keepPowerups) {
    player.isBig = game.keepIsBig;
    player.hasFire = game.keepHasFire;
  } else {
    player.isBig = false;
    player.hasFire = false;
  }
  player.isStar = false;
  player.starTimer = 0;
  player.invuln = 0;
  player.fireballs = [];
  player.jumpHoldTimer = 0;
  player.isJumping = false;
  player.enteringPipe = null;
  player.exitTimer = 0;
  player.pipeLockTimer = 0;
  player.animTimer = 0;
  player.bobTimer = 0;
  player.dustTimer = 0;
  game.cameraX = 0;
  game.lastStepSound = 0;
}

function currentGrid() {
  return game.bonusLevel ? game.bonusLevel : game.level;
}

function solidAt(tx, ty) {
  const L = currentGrid();
  if (ty < 0 || ty >= L.H) return false;
  if (tx < 0 || tx >= L.W) return true;
  const t = L.grid[ty][tx];
  return t === T.GROUND || t === T.BRICK || t === T.QUESTION ||
         isPipeTile(t) || isPipeInTile(t);
}

function rectCollides(x, y, w, h) {
  const x0 = Math.floor(x);
  const x1 = Math.floor(x + w - 0.001);
  const y0 = Math.floor(y);
  const y1 = Math.floor(y + h - 0.001);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (solidAt(tx, ty)) return { tx, ty };
    }
  }
  return null;
}

function movePlayer(dx, dy) {
  player.x += dx;
  let c = rectCollides(player.x, player.y, player.w, player.h);
  if (c) {
    if (dx > 0) player.x = c.tx - player.w - 0.001;
    else if (dx < 0) player.x = c.tx + 1.001;
    player.vx = 0;
  }
  const wasOnGround = player.onGround;
  player.y += dy;
  c = rectCollides(player.x, player.y, player.w, player.h);
  if (c) {
    if (dy > 0) {
      player.y = c.ty - player.h - 0.001;
      player.vy = 0;
      if (!wasOnGround) {
        // приземление — пыль
        spawnLandingDust();
      }
      player.onGround = true;
      player.isJumping = false;
    } else if (dy < 0) {
      player.y = c.ty + 1.001;
      player.vy = 0;
      hitBlockFromBelow(c.tx, c.ty);
    }
  } else if (dy > 0) {
    player.onGround = false;
  }
}

function hitBlockFromBelow(tx, ty) {
  const L = game.level;
  if (!L) return;
  const t = L.grid[ty][tx];
  if (t === T.QUESTION) {
    L.grid[ty][tx] = T.EMPTY;
    playSound('hitBlock');
    spawnParticles(tx + 0.5, ty + 0.5, PAL.question, 6);
    const roll = Math.random();
    if (roll < 0.55) {
      game.coins++; game.score += 100;
      playSound('coin');
      spawnParticles(tx + 0.5, ty, PAL.coin, 6);
    } else if (roll < 0.8) {
      L.items.push({
        type: 'mushroom',
        x: tx + 0.5, y: ty,
        vx: 3, vy: 0,
        timer: 0, riseTimer: 0.6,
        startY: ty,
        onGround: false,
      });
      playSound('powerup');
    } else {
      L.items.push({
        type: 'fireflower',
        x: tx + 0.5, y: ty,
        vx: 0, vy: 0,
        timer: 0, riseTimer: 0.6,
        startY: ty,
        onGround: true,
      });
      playSound('powerup');
    }
  } else if (t === T.BRICK) {
    if (player.isBig || player.isStar) {
      L.grid[ty][tx] = T.EMPTY;
      playSound('brick');
      spawnParticles(tx + 0.5, ty + 0.5, PAL.brick, 10);
      game.score += 50;
    } else {
      playSound('hitBlock');
    }
  }
}

function standingOnEntryPipe() {
  const L = game.bonusLevel ? game.bonusLevel : game.level;
  if (!L) return false;
  const footYBase = Math.floor(player.y + player.h - 0.001);
  const cx = player.x + player.w / 2;
  const checkXs = [
    Math.floor(cx - 0.9),
    Math.floor(cx - 0.4),
    Math.floor(cx),
    Math.floor(cx + 0.4),
    Math.floor(cx + 0.9),
  ];
  for (let dy = 0; dy <= 2; dy++) {
    const ty = footYBase + dy;
    if (ty < 0 || ty >= L.H) continue;
    for (const tx of checkXs) {
      if (tx < 0 || tx >= L.W) continue;
      const t = L.grid[ty][tx];
      if (t === T.PIPE_IN_TL || t === T.PIPE_IN_TR) return true;
    }
  }
  return false;
}

function spawnRunningDust() {
  game.particles.push({
    x: player.x + (player.facing > 0 ? 0 : player.w),
    y: player.y + player.h - 0.1,
    vx: -player.facing * (0.5 + Math.random() * 0.8),
    vy: -0.4 - Math.random() * 0.5,
    life: CONFIG.dustLife,
    color: CONFIG.dustColor,
    size: CONFIG.dustSize,
    noGravity: true,
  });
}

function spawnLandingDust() {
  const cy = player.y + player.h - 0.05;
  for (let i = 0; i < 5; i++) {
    game.particles.push({
      x: player.x + player.w / 2,
      y: cy,
      vx: (Math.random() - 0.5) * 3,
      vy: -0.6 - Math.random() * 0.8,
      life: CONFIG.dustLife,
      color: CONFIG.dustColor,
      size: CONFIG.dustSize + Math.random() * 2,
      noGravity: true,
    });
  }
}

function updatePlayer(dt) {
  if (player.dead) return;
  if (player.pipeLockTimer > 0) player.pipeLockTimer -= dt;

  if (player.enteringPipe) {
    player.exitTimer -= dt;
    player.y += 3 * dt;
    if (player.exitTimer <= 0) {
      enterBonusLevel();
    }
    return;
  }

  const targetDir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const maxSpeed = CONFIG.walkSpeed;

  if (targetDir !== 0) {
    player.vx += CONFIG.accel * targetDir * dt;
    if (player.vx > maxSpeed) player.vx = maxSpeed;
    if (player.vx < -maxSpeed) player.vx = -maxSpeed;
    player.facing = targetDir;
  } else {
    if (Math.abs(player.vx) < CONFIG.friction * dt) player.vx = 0;
    else player.vx -= CONFIG.friction * Math.sign(player.vx) * dt;
  }

  if (input.jumpPressed && player.onGround) {
    player.vy = -CONFIG.jumpPower;
    player.onGround = false;
    player.isJumping = true;
    player.jumpHoldTimer = CONFIG.jumpHoldTime;
    playSound('jump');
  }
  input.jumpPressed = false;

  if (input.jump && player.isJumping && player.jumpHoldTimer > 0 && player.vy < 0) {
    player.vy -= CONFIG.jumpHoldBoost * dt;
    player.jumpHoldTimer -= dt;
  }

  if (input.down && player.onGround && player.pipeLockTimer <= 0) {
    if (standingOnEntryPipe()) {
      if (game.bonusLevel) {
        exitBonusLevel();
        return;
      } else {
        player.enteringPipe = true;
        player.exitTimer = 0.7;
        player.vx = 0; player.vy = 0;
        playPipeSwoosh();
        return;
      }
    }
  }

  player.vy += CONFIG.gravity * dt;
  if (player.vy > CONFIG.maxFallSpeed) player.vy = CONFIG.maxFallSpeed;

  movePlayer(player.vx * dt, player.vy * dt);

  if (input.firePressed && player.hasFire && !game.bonusLevel) {
    input.firePressed = false;
    if (player.fireballs.length < 2) {
      player.fireballs.push({
        x: player.x + player.w / 2 + player.facing * 0.5,  // ← сдвиг на 0.5 тайла вперёд
        y: player.y + player.h / 2,
        vx: CONFIG.fireballSpeed * player.facing,
        vy: -3,
        life: 3.0,
      });
      playSound('fire');
    }
  }
  input.firePressed = false;

  for (const fb of player.fireballs) {
    fb.vy += 15 * dt;
    if (fb.vy > 12) fb.vy = 12;
    fb.x += fb.vx * dt;
    fb.y += fb.vy * dt;
    if (rectCollides(fb.x, fb.y, 0.3, 0.3)) {
      fb.life = 0;
      spawnParticles(fb.x, fb.y, PAL.flowerRed, 4);
    }
    fb.life -= dt;
  }
  player.fireballs = player.fireballs.filter(f => f.life > 0);

  if (player.invuln > 0) player.invuln -= dt;
  if (player.starTimer > 0) {
    player.starTimer -= dt;
    if (player.starTimer <= 0) player.isStar = false;
  }

  if (player.y > currentGrid().H + 2) killPlayer();

  if (!game.bonusLevel && !game.flagDone && player.x >= game.level.flagX) {
    game.flagDone = true;
    completeLevel();
  }

  checkEnemies(dt);
  checkItems(dt);

  const L = currentGrid();
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;
  for (let i = L.coins.length - 1; i >= 0; i--) {
    const c = L.coins[i];
    const dx = c.x + 0.5 - pcx;
    const dy = c.y + 0.5 - pcy;
    if (dx*dx + dy*dy < 0.5) {
      L.coins.splice(i, 1);
      game.coins++;
      game.score += 100;
      playSound('coin');
      spawnParticles(c.x + 0.5, c.y + 0.5, PAL.coin, 5);
    }
  }

  // Анимация + звук шагов + пыль
  const movingOnGround = player.onGround && Math.abs(player.vx) > 0.5;
  if (movingOnGround) {
    const prevFrame = Math.floor(player.animTimer / CONFIG.runFrameTime);
    player.animTimer += dt;
    player.bobTimer += dt;
    player.dustTimer += dt;
    const curFrame = Math.floor(player.animTimer / CONFIG.runFrameTime);
    if (curFrame !== prevFrame) {
      playStep();
    }
    // Спавним пыль каждые 2 кадра анимации
    if (player.dustTimer > CONFIG.runFrameTime * 2) {
      player.dustTimer = 0;
      spawnRunningDust();
    }
  } else {
    player.animTimer = 0;
    player.bobTimer = 0;
    player.dustTimer = 0;
  }
}

function checkItems(dt) {
  const L = currentGrid();
  if (!L.items) return;
  for (let i = L.items.length - 1; i >= 0; i--) {
    const it = L.items[i];
    if (it.riseTimer > 0) {
      it.riseTimer -= dt;
      it.y = it.startY - (0.6 - it.riseTimer);
      continue;
    }
    if (it.type === 'mushroom') {
      it.vy += CONFIG.gravity * dt;
      if (it.vy > CONFIG.maxFallSpeed) it.vy = CONFIG.maxFallSpeed;
      let nx = it.x + it.vx * dt;
      if (rectCollides(nx - 0.5, it.y, 1, 1)) {
        it.vx = -it.vx;
      } else {
        it.x = nx;
      }
      let ny = it.y + it.vy * dt;
      if (rectCollides(it.x - 0.5, ny, 1, 1)) {
        if (it.vy > 0) { it.y = Math.floor(ny + 1) - 1 - 0.001; it.vy = 0; }
        else { it.y = Math.floor(ny) + 1.001; it.vy = 0; }
      } else {
        it.y = ny;
      }
      if (it.y > L.H + 2) { L.items.splice(i, 1); continue; }
    }
    const dx = Math.abs((it.x) - (player.x + player.w/2));
    const dy = Math.abs((it.y) - (player.y + player.h/2));
    if (dx < 0.8 && dy < 0.8) {
      if (it.type === 'mushroom') {
        if (!player.isBig) { player.isBig = true; }
        else { game.score += 1000; }
        playSound('powerup');
      } else if (it.type === 'fireflower') {
        player.hasFire = true;
        player.isBig = true;
        playSound('powerup');
      } else if (it.type === 'star') {
        player.isStar = true;
        player.starTimer = CONFIG.starTime;
        playSound('star');
      }
      L.items.splice(i, 1);
      game.score += 500;
    }
  }
}

function checkEnemies(dt) {
  const L = game.level;
  if (game.bonusLevel) return;
  for (let i = L.enemies.length - 1; i >= 0; i--) {
    const e = L.enemies[i];

    if (e.type === 'walker') {
      const nx = e.x + CONFIG.enemySpeed * e.dir * dt;
      const nextTx = Math.floor(nx + (e.dir > 0 ? 1 : 0));
      const ty = Math.floor(e.y + 0.5);
      if (solidAt(nextTx, ty)) {
        e.dir = -e.dir;
      } else {
        const footY = Math.floor(e.y + 1 + 0.1);
        if (!solidAt(Math.floor(nx + 0.5), footY)) {
          e.dir = -e.dir;
        } else {
          e.x = nx;
        }
      }
      // Таймер анимации лап
      e.animTimer = (e.animTimer || 0) + dt;
    } else if (e.type === 'jumper') {
      e.vy = (e.vy || 0) + CONFIG.gravity * dt;
      if (e.vy > CONFIG.maxFallSpeed) e.vy = CONFIG.maxFallSpeed;
      e.timer = (e.timer || 0) - dt;
      const belowY = e.y + 1;
      const onGround = solidAt(Math.floor(e.x + 0.5), Math.floor(belowY));
      if (onGround && e.vy >= 0) {
        e.y = Math.floor(belowY) - 1 - 0.001;
        e.vy = 0;
        if (e.timer <= 0) {
          e.vy = -CONFIG.enemyJumpPower;
          e.timer = 0.7 + Math.random() * 0.4;
        }
      }
      e.y += e.vy * dt;
    } else if (e.type === 'flower') {
      e.timer = (e.timer || 0) + dt;
      e.visible = (e.timer % 3.0) < 1.5;
    }

    if (player.dead) continue;
    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    const ex = e.x;
    const ey = e.y + 0.5;
    const dx = Math.abs(px - ex);
    const dy = Math.abs(py - ey);

    if (e.type === 'flower' && !e.visible) continue;

    if (dx < 0.9 && dy < 0.9) {
      if (player.isStar) {
        L.enemies.splice(i, 1);
        game.score += 200;
        playSound('stomp');
        spawnParticles(ex, ey, PAL.starYellow, 8);
        continue;
      }

      const stomping = player.vy > 0 && (player.y + player.h) < (e.y + 0.6) && e.type !== 'flower';
      if (stomping) {
        L.enemies.splice(i, 1);
        player.vy = -CONFIG.jumpPower * 0.75;
        game.score += 200;
        playSound('stomp');
        spawnParticles(ex, ey, PAL.enemyBrown, 6);
      } else {
        if (player.invuln > 0) continue;
        if (player.hasFire) { player.hasFire = false; player.invuln = CONFIG.invulnTime; }
        else if (player.isBig) { player.isBig = false; player.invuln = CONFIG.invulnTime; }
        else killPlayer();
      }
    }

    for (const fb of player.fireballs) {
      const fdx = Math.abs(fb.x - ex);
      const fdy = Math.abs(fb.y - ey);
      if (fdx < 0.7 && fdy < 0.7) {
        L.enemies.splice(i, 1);
        fb.life = 0;
        game.score += 200;
        playSound('stomp');
        spawnParticles(ex, ey, PAL.flowerRed, 6);
        break;
      }
    }
  }
}

function killPlayer() {
  if (player.dead) return;
  player.dead = true;
  player.vy = -8;
  playSound('die');
  stopMusic();
  game.state = 'dead';
  game.transitionTimer = 1.8;
}

function completeLevel() {
  game.state = 'levelComplete';
  game.transitionTimer = 3.0;
  game.fireworks = [];
  stopMusic();
  playWinFanfare();
}

function advanceFromOverlay() {
  if (game.state === 'levelComplete') {
    game.keepIsBig = player.isBig;
    game.keepHasFire = player.hasFire;
    if (game.levelIndex >= 6) {
      game.state = 'gameWin';
      game.transitionTimer = 5.0;
    } else {
      loadLevel(game.levelIndex + 1, true);
      game.state = 'playing';
    }
  } else if (game.state === 'gameWin') {
    game.state = 'title';
    startMusic('title');
  }
}

/* --- Бонус-подземелье --- */

function enterBonusLevel() {
  const W = 30, H = 14;
  const grid = [];
  for (let y = 0; y < H; y++) grid.push(new Array(W).fill(T.EMPTY));

  for (let x = 0; x < W; x++) {
    grid[0][x] = T.GROUND;
    grid[1][x] = T.GROUND;
    grid[H-1][x] = T.GROUND;
    grid[H-2][x] = T.GROUND;
  }
  for (let y = 0; y < H; y++) {
    grid[y][0] = T.GROUND;
    grid[y][W-1] = T.GROUND;
  }

  const groundTopY = H - 3;

  for (let i = 0; i < 4; i++) grid[groundTopY - 2][3 + i] = T.BRICK;
  for (let i = 0; i < 3; i++) grid[groundTopY - 3][8 + i] = T.BRICK;
  for (let i = 0; i < 3; i++) grid[groundTopY - 5][12 + i] = T.BRICK;

  const coins = [];
  for (let x = 3; x < W - 4; x++) {
    const y = groundTopY - 2;
    if (x % 2 === 0 && grid[y][x] === T.EMPTY) {
      coins.push({ x, y });
    }
  }
  for (let x = 6; x < W - 4; x++) {
    const y = groundTopY - 6;
    if (x % 2 === 1 && grid[y][x] === T.EMPTY) {
      coins.push({ x, y });
    }
  }

  grid[H-3][W-3] = T.PIPE_IN_TL;
  grid[H-3][W-2] = T.PIPE_IN_TR;
  grid[H-4][W-3] = T.PIPE_IN_BL;
  grid[H-4][W-2] = T.PIPE_IN_BR;

  game.bonusLevel = {
    grid, W, H,
    groundY: H - 2,
    groundTopY: H - 3,
    coins,
    items: [],
    enemies: [],
    isUnderground: true,
  };
  game.bonusReturn = {
    x: player.x,
    y: player.y,
    levelIndex: game.levelIndex,
  };
  player.x = 2;
  player.y = H - 3 - 0.001;
  player.vx = 0; player.vy = 0;
  player.enteringPipe = false;
  player.pipeLockTimer = 0;
  game.cameraX = player.x + player.w / 2 - CW / CONFIG.tileSize / 2;
  if (game.cameraX < 0) game.cameraX = 0;
}

function exitBonusLevel() {
  game.bonusLevel = null;
  player.x = game.bonusReturn.x - 1.5;
  if (player.x < 0.5) player.x = game.bonusReturn.x + 1.5;
  player.y = game.bonusReturn.y - 1;
  player.vx = 0; player.vy = 0;
  player.enteringPipe = false;
  player.pipeLockTimer = CONFIG.pipeLockTime;
  game.bonusReturn = null;
  game.cameraX = player.x + player.w / 2 - CW / CONFIG.tileSize / 2;
  if (game.cameraX < 0) game.cameraX = 0;
  playPipeSwoosh();
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    game.particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,

      vy: -Math.random() * 5 - 1,
      life: 0.5 + Math.random() * 0.4,
      color,
      size: 3 + Math.random() * 3,
    });
  }
}

function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (!p.noGravity) p.vy += 18 * dt;
    p.life -= dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}

/* =========================================================
   КОНЕЦ ЧАСТИ 5. Далее — рендер и главный цикл (часть 6/6).
   ========================================================= */
/* =========================================================
   8. РЕНДЕР
   ========================================================= */

function drawGroundTile(sx, sy, size) {
  ctx.fillStyle = PAL.ground;
  ctx.fillRect(sx, sy, size, size);
  const half = Math.floor(size / 2);
  ctx.fillStyle = PAL.brickDark;
  ctx.fillRect(sx, sy + half - 1, size, 2);
  ctx.fillRect(sx + half - 1, sy, 2, size);
  ctx.fillStyle = PAL.groundTop;
  ctx.fillRect(sx, sy, size, 2);
  ctx.fillRect(sx, sy, 2, size);
  ctx.fillStyle = PAL.groundDark;
  ctx.fillRect(sx, sy + size - 2, size, 2);
  ctx.fillRect(sx + size - 2, sy, 2, size);
}

function drawPipeTile(t, sx, sy, size) {
  const isIn = isPipeInTile(t);
  const baseCol = isIn ? PAL.pipeIn : PAL.pipe;
  const darkCol = isIn ? PAL.pipeInDark : PAL.pipeDark;
  const lightCol = isIn ? PAL.pipeInLight : PAL.pipeLight;

  ctx.fillStyle = baseCol;
  ctx.fillRect(sx, sy, size, size);

  const isTop = (t === T.PIPE_TL || t === T.PIPE_TR || t === T.PIPE_IN_TL || t === T.PIPE_IN_TR);
  const isLeft = (t === T.PIPE_TL || t === T.PIPE_BL || t === T.PIPE_IN_TL || t === T.PIPE_IN_BL);

  if (isTop) {
    ctx.fillStyle = lightCol;
    ctx.fillRect(sx, sy, size, 5);
    ctx.fillStyle = darkCol;
    ctx.fillRect(sx, sy + size - 2, size, 2);
  }
  if (isLeft) {
    ctx.fillStyle = darkCol;
    ctx.fillRect(sx, sy, 3, size);
  } else {
    ctx.fillStyle = darkCol;
    ctx.fillRect(sx + size - 3, sy, 3, size);
  }
  ctx.fillStyle = lightCol;
  ctx.globalAlpha = 0.4;
  ctx.fillRect(sx + Math.floor(size/2) - 1, sy, 2, size);
  ctx.globalAlpha = 1;
}

function drawTile(t, sx, sy, size) {
  if (t === T.GROUND) {
    drawGroundTile(sx, sy, size);
  } else if (t === T.BRICK) {
    ctx.fillStyle = PAL.brick;
    ctx.fillRect(sx, sy, size, size);
    ctx.fillStyle = PAL.brickDark;
    ctx.fillRect(sx, sy + size/2 - 1, size, 2);
    ctx.fillRect(sx + size/2 - 1, sy, 2, size);
    ctx.fillStyle = PAL.brickLine;
    ctx.fillRect(sx, sy, size, 2);
    ctx.fillRect(sx, sy, 2, size);
  } else if (t === T.QUESTION) {
    ctx.fillStyle = PAL.question;
    ctx.fillRect(sx, sy, size, size);
    ctx.fillStyle = PAL.questionDk;
    ctx.fillRect(sx, sy, size, 3);
    ctx.fillRect(sx, sy + size - 3, size, 3);
    ctx.fillRect(sx, sy, 3, size);
    ctx.fillRect(sx + size - 3, sy, 3, size);
    ctx.fillStyle = PAL.white;
    ctx.font = `bold ${Math.floor(size*0.75)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', sx + size/2, sy + size/2 + 1);
  } else if (isPipeTile(t) || isPipeInTile(t)) {
    drawPipeTile(t, sx, sy, size);
  }
}

/* --- Декорации --- */

function drawMountains(L) {
  if (!L.decor || !L.decor.mountains) return;
  const size = CONFIG.tileSize;
  const parallax = 0.2;
  const baseY = L.groundY * size + size;
  for (const m of L.decor.mountains) {
    const mx = (m.x * size - game.cameraX * size * parallax) % (L.W * size + 800);
    const screenX = mx - 400;
    if (screenX < -600 || screenX > CW + 600) continue;
    const mh = m.size * size * 0.8;
    const mw = m.size * size * 1.8;
    ctx.fillStyle = PAL.mountain;
    ctx.beginPath();
    ctx.moveTo(screenX, baseY);
    ctx.lineTo(screenX + mw / 2, baseY - mh);
    ctx.lineTo(screenX + mw, baseY);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = PAL.mountainDark;
    ctx.beginPath();
    ctx.moveTo(screenX + mw / 2, baseY - mh);
    ctx.lineTo(screenX + mw, baseY);
    ctx.lineTo(screenX + mw / 2, baseY);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = PAL.mountainSnow;
    ctx.beginPath();
    ctx.moveTo(screenX + mw / 2 - mw * 0.12, baseY - mh + mh * 0.25);
    ctx.lineTo(screenX + mw / 2, baseY - mh);
    ctx.lineTo(screenX + mw / 2 + mw * 0.12, baseY - mh + mh * 0.25);
    ctx.lineTo(screenX + mw / 2 + mw * 0.06, baseY - mh + mh * 0.22);
    ctx.lineTo(screenX + mw / 2 - mw * 0.06, baseY - mh + mh * 0.22);
    ctx.closePath();
    ctx.fill();
  }
}

function drawTrees(L) {
  if (!L.decor || !L.decor.trees) return;
  const size = CONFIG.tileSize;
  const parallax = 0.4;
  const baseY = L.groundY * size;
  for (const t of L.decor.trees) {
    const tx = (t.x * size - game.cameraX * size * parallax) % (L.W * size + 400);
    const screenX = tx - 200;
    if (screenX < -200 || screenX > CW + 200) continue;
    ctx.fillStyle = PAL.treeTrunk;
    ctx.fillRect(screenX + size * 0.6, baseY - size * 1.5, size * 0.8, size * 1.5);
    ctx.fillStyle = PAL.treeTrunkDk;
    ctx.fillRect(screenX + size * 1.1, baseY - size * 1.5, size * 0.3, size * 1.5);
    ctx.fillStyle = PAL.treeLeaves;
    ctx.beginPath();
    ctx.arc(screenX + size, baseY - size * 2, size * 0.9, 0, Math.PI * 2);
    ctx.arc(screenX + size * 0.3, baseY - size * 1.7, size * 0.7, 0, Math.PI * 2);
    ctx.arc(screenX + size * 1.7, baseY - size * 1.7, size * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = PAL.treeLeavesDk;
    ctx.beginPath();
    ctx.arc(screenX + size * 1.4, baseY - size * 1.9, size * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBushes(L) {
  if (!L.decor || !L.decor.bushes) return;
  const size = CONFIG.tileSize;
  const parallax = 0.6;
  const baseY = L.groundY * size;
  for (const b of L.decor.bushes) {
    const bx = (b.x * size - game.cameraX * size * parallax) % (L.W * size + 200);
    const screenX = bx - 100;
    if (screenX < -150 || screenX > CW + 150) continue;
    ctx.fillStyle = PAL.bush;
    ctx.beginPath();
    ctx.arc(screenX + size * 0.5, baseY, size * 0.55, Math.PI, 0);
    ctx.arc(screenX + size * 1.2, baseY, size * 0.65, Math.PI, 0);
    ctx.arc(screenX + size * 1.9, baseY, size * 0.55, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = PAL.bushDark;
    ctx.fillRect(screenX, baseY - size * 0.15, size * 2.4, size * 0.15);
  }
}

function drawClouds() {
  ctx.fillStyle = PAL.cloud;
  const size = CONFIG.tileSize;
  for (let i = 0; i < 8; i++) {
    const cx = ((i * 300 - game.cameraX * size * 0.3) % (CW + 400)) - 200;
    const cy = 40 + (i % 3) * 50;
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI * 2);
    ctx.arc(cx + 25, cy - 5, 25, 0, Math.PI * 2);
    ctx.arc(cx + 50, cy, 20, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* --- Персонаж, враги, объекты --- */

function drawPlayer() {
  if (player.dead && game.transitionTimer < 0.6) return;
  if (player.invuln > 0 && Math.floor(player.invuln * 20) % 2 === 0) return;

  let key;
  const base = game.hero;
  const prefix = base === 'princess' ? 'princess' : (base === 'blue' ? 'blue' : 'yellow');

  const movingOnGround = player.onGround && Math.abs(player.vx) > 0.5;

  if (!player.onGround) {
    key = prefix + 'Jump';
  } else if (movingOnGround) {
    const frame = Math.floor(player.animTimer / CONFIG.runFrameTime) % 2;
    key = prefix + 'Run' + (frame === 1 ? '2' : '');
  } else {
    key = prefix + 'Stand';
  }

  const spr = SPRITE_CACHE[key] || SPRITE_CACHE[prefix + 'Stand'];
  const size = CONFIG.tileSize;
  const sx = (player.x - game.cameraX) * size;
  let sy = player.y * size;

  if (movingOnGround) {
    const bob = Math.sin(player.bobTimer * Math.PI * 2 / (CONFIG.runFrameTime * 2)) * CONFIG.runBobAmount;
    sy += bob;
  }
  sy = Math.round(sy);

  const scale = player.isBig ? 1.35 : 1.0;
  const w = size * scale;
  const h = size * scale;
  const ox = (w - size) / 2;
  const oy = h - size;

  ctx.save();
  if (player.isStar) {
    const hue = (performance.now() / 50) % 360;
    ctx.filter = `hue-rotate(${hue}deg)`;
  }
  if (player.facing < 0) {
    ctx.translate(sx + size / 2 + ox, sy);
    ctx.scale(-1, 1);
    ctx.drawImage(spr, -w/2, -oy, w, h);
  } else {
    ctx.drawImage(spr, sx - ox, sy - oy, w, h);
  }
  ctx.filter = 'none';
  ctx.restore();
}

function drawEnemy(e) {
  const size = CONFIG.tileSize;
  let sx, sy;
  if (e.type === 'flower') {
    sx = Math.floor((e.x - 0.5 - game.cameraX) * size);
    sy = Math.floor((e.y + 0.3) * size);
  } else {
    sx = Math.floor((e.x - game.cameraX) * size);
    sy = Math.floor(e.y * size);
  }
  let spr;
  if (e.type === 'walker') {
    // Анимация лап: 2 кадра
    const frame = Math.floor((e.animTimer || 0) / 0.15) % 2;
    spr = frame === 1 ? SPRITE_CACHE.walker2 : SPRITE_CACHE.walker;
  }
  else if (e.type === 'jumper') spr = SPRITE_CACHE.jumper;
  else if (e.type === 'flower') spr = e.visible ? SPRITE_CACHE.flowerUp : SPRITE_CACHE.flowerDown;
  if (!spr) return;
  ctx.drawImage(spr, sx, sy, size, size);
}

function drawItem(it) {
  const size = CONFIG.tileSize;
  const sx = (it.x - 0.5 - game.cameraX) * size;
  const sy = it.y * size;
  let spr;
  if (it.type === 'mushroom') spr = SPRITE_CACHE.mushroom;
  else if (it.type === 'fireflower') spr = SPRITE_CACHE.fireflower;
  else if (it.type === 'star') spr = SPRITE_CACHE.star;
  if (!spr) return;
  ctx.drawImage(spr, sx, sy, size, size);
}

function drawCoin(c) {
  const size = CONFIG.tileSize;
  const sx = (c.x - game.cameraX) * size;
  const sy = c.y * size;
  const t = performance.now() / 150;
  const scale = Math.abs(Math.cos(t));
  ctx.save();
  ctx.translate(sx + size/2, sy + size/2);
  ctx.scale(scale, 1);
  ctx.drawImage(SPRITE_CACHE.coin, -size/2, -size/2, size, size);
  ctx.restore();
}

function drawFireball(fb) {
  const size = CONFIG.tileSize;
  const sx = (fb.x - game.cameraX) * size;
  const sy = fb.y * size;
  const hue = (performance.now() / 30) % 360;
  ctx.fillStyle = `hsl(${hue}, 100%, 55%)`;
  ctx.beginPath();
  ctx.arc(sx, sy, size * 0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = PAL.question;
  ctx.beginPath();
  ctx.arc(sx, sy, size * 0.18, 0, Math.PI * 2);
  ctx.fill();
}

function drawParticles() {
  const size = CONFIG.tileSize;
  for (const p of game.particles) {
    const alpha = Math.min(1, p.life / (p.noGravity ? CONFIG.dustLife : 0.5));
    ctx.globalAlpha = alpha * (p.noGravity ? 0.6 : 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(
      (p.x - game.cameraX) * size - p.size/2,
      p.y * size - p.size/2,
      p.size, p.size
    );
  }
  ctx.globalAlpha = 1;
}

function drawFlag() {
  const L = game.level;
  const size = CONFIG.tileSize;
  const fx = (L.flagX - game.cameraX) * size;
  const poleTopY = (L.groundY - 6) * size;
  const poleHeight = size * 6;
  ctx.fillStyle = PAL.groundDark;
  ctx.fillRect(fx, poleTopY, 4, poleHeight);
  // Флаг всегда наверху (опускание убрано — переход мгновенный)
  const flagY = poleTopY + 4;
  ctx.fillStyle = PAL.heroRed;
  ctx.beginPath();
  ctx.moveTo(fx + 4, flagY);
  ctx.lineTo(fx + size * 1.6, flagY + size * 0.35);
  ctx.lineTo(fx + 4, flagY + size * 0.7);
  ctx.fill();
}

function drawBackground() {
  const L = game.bonusLevel ? game.bonusLevel : game.level;
  if (L.isUnderground || game.bonusLevel) {
    ctx.fillStyle = PAL.skyUnder;
    ctx.fillRect(0, 0, CW, CH);
  } else {
    ctx.fillStyle = PAL.sky;
    ctx.fillRect(0, 0, CW, CH);
    drawMountains(L);
    drawTrees(L);
    drawClouds();
    drawBushes(L);
  }
}

function drawLevel() {
  const L = game.bonusLevel ? game.bonusLevel : game.level;
  const size = CONFIG.tileSize;
  const startX = Math.max(0, Math.floor(game.cameraX) - 1);
  const endX = Math.min(L.W, Math.ceil(game.cameraX + CW / size) + 1);
  for (let ty = 0; ty < L.H; ty++) {
    for (let tx = startX; tx < endX; tx++) {
      const t = L.grid[ty][tx];
      if (t !== T.EMPTY) {
        drawTile(t, (tx - game.cameraX) * size, ty * size, size);
      }
    }
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, CW, 50);
  ctx.fillStyle = PAL.white;
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`Уровень: ${game.levelIndex + 1}/7`, 12, 25);
  ctx.textAlign = 'center';
  ctx.fillText(`Монеты: ${game.coins}`, CW/2, 25);
  ctx.textAlign = 'right';
  ctx.fillText(`Жизни: ${'❤'.repeat(game.lives)}`, CW - 12, 25);
  ctx.textAlign = 'center';
  ctx.fillText(`Очки: ${game.score}`, CW/2, 45);
  if (player.isStar) {
    ctx.fillStyle = PAL.starYellow;
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`★ ${Math.ceil(player.starTimer)}`, CW - 100, 45);
  }
  ctx.fillStyle = 'rgba(255,0,0,0.9)';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`CH=${CH} ts=${CONFIG.tileSize} py=${player.y.toFixed(1)}`, 12, CH - 5);
}

function drawButtons() {
  ctx.save();
  ctx.globalAlpha = 0.35;
  for (const b of buttons) {
    ctx.fillStyle = PAL.white;
    ctx.beginPath();
    ctx.arc(b.x + b.w/2, b.y + b.h/2, Math.min(b.w, b.h)/2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = PAL.black;
    ctx.font = `bold ${Math.min(b.w, b.h) * 0.5}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let label = '';
    if (b.id === 'left') label = '◀';
    else if (b.id === 'right') label = '▶';
    else if (b.id === 'up') label = '▲';
    else if (b.id === 'down') label = '▼';
    else if (b.id === 'jump') label = 'A';
    else if (b.id === 'fire') label = 'B';
    ctx.fillText(label, b.x + b.w/2, b.y + b.h/2 + 2);
  }
  ctx.restore();
}

function drawTitle() {
  ctx.fillStyle = PAL.sky;
  ctx.fillRect(0, 0, CW, CH);
  ctx.fillStyle = PAL.white;
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('МАРИО-РОГАЛИК', CW/2, 100);
  ctx.font = 'bold 24px monospace';
  ctx.fillText('Выбери персонажа:', CW/2, CH/2 - 80);

  const opts = ['princess', 'blue', 'yellow'];
  const labels = ['Принцесса', 'Синий', 'Жёлтый'];
  const bw = 100, gap = 40;
  const totalW = opts.length * bw + (opts.length - 1) * gap;
  const startX = CW/2 - totalW/2;
  const by = CH/2 - 30;
  for (let i = 0; i < opts.length; i++) {
    const bx = startX + i * (bw + gap);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(bx, by, bw, bw + 40);
    const spr = SPRITE_CACHE[opts[i] + 'Stand'];
    ctx.drawImage(spr, bx + bw/2 - 40, by + 5, 80, 80);
    ctx.fillStyle = PAL.black;
    ctx.font = 'bold 14px monospace';
    ctx.fillText(labels[i], bx + bw/2, by + bw + 20);
  }
  ctx.fillStyle = PAL.white;
  ctx.font = '18px monospace';
  ctx.fillText('Нажми на персонажа, чтобы начать', CW/2, CH - 80);
}

function handleTitleTap(px, py) {
  const opts = ['princess', 'blue', 'yellow'];
  const bw = 100, gap = 40;
  const totalW = opts.length * bw + (opts.length - 1) * gap;
  const startX = CW/2 - totalW/2;
  const by = CH/2 - 30;
  for (let i = 0; i < opts.length; i++) {
    const bx = startX + i * (bw + gap);
    if (px >= bx && px <= bx + bw && py >= by && py <= by + bw + 40) {
      startGame(opts[i]);
      return;
    }
  }
}

function drawCastle(fireworksActive) {
  const cx = CW/2;
  const cy = CH/2;
  const bw = 200, bh = 180;
  ctx.fillStyle = PAL.brick;
  ctx.fillRect(cx - bw/2, cy - bh/2, bw, bh);
  ctx.fillStyle = PAL.brickDark;
  for (let i = 0; i < bw; i += 20) {
    ctx.fillRect(cx - bw/2 + i, cy - bh/2, 2, bh);
  }
  ctx.fillStyle = PAL.brick;
  ctx.fillRect(cx - bw/2 - 30, cy - bh/2 - 40, 50, bh + 40);
  ctx.fillRect(cx + bw/2 - 20, cy - bh/2 - 40, 50, bh + 40);
  ctx.fillStyle = PAL.groundDark;
  ctx.fillRect(cx - 25, cy + bh/2 - 60, 50, 60);
  ctx.fillStyle = PAL.groundDark;
  ctx.fillRect(cx - 2, cy - bh/2 - 100, 4, 60);
  ctx.fillStyle = PAL.heroRed;
  ctx.beginPath();
  ctx.moveTo(cx + 2, cy - bh/2 - 100);
  ctx.lineTo(cx + 40, cy - bh/2 - 80);
  ctx.lineTo(cx + 2, cy - bh/2 - 60);
  ctx.fill();

  if (fireworksActive) {
    for (const f of game.fireworks) {
      for (const p of f.particles) {
        ctx.globalAlpha = Math.max(0, p.life / 1.0);
        ctx.fillStyle = f.color;
        ctx.fillRect(p.x, p.y, 4, 4);
      }
    }
    ctx.globalAlpha = 1;
  }
}

function updateFireworks(dt) {
  if (Math.random() < 2.0 * dt) {
    const colors = [PAL.heroRed, PAL.question, PAL.coin, PAL.flowerRed, PAL.white, PAL.enemyGreen, PAL.starYellow];
    const parts = [];
    const color = colors[Math.floor(Math.random() * colors.length)];
    const originX = CW * (0.2 + Math.random() * 0.6);
    const originY = CH * (0.1 + Math.random() * 0.35);
    for (let i = 0; i < 30; i++) {
      const a = (i / 30) * Math.PI * 2;
      const sp = 60 + Math.random() * 120;
      parts.push({
        x: originX, y: originY,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1.0,
      });
    }
    game.fireworks.push({ particles: parts, color });
    playSound('firework');
  }
  for (let i = game.fireworks.length - 1; i >= 0; i--) {
    const f = game.fireworks[i];
    for (const p of f.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 60 * dt;
      p.life -= dt;
    }
    if (f.particles[0].life <= 0) game.fireworks.splice(i, 1);
  }
}

function drawLevelComplete() {
  drawBackground();
  drawCastle(true);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(CW/2 - 220, CH/2 + 100, 440, 80);
  ctx.fillStyle = PAL.white;
  ctx.font = 'bold 30px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`Уровень ${game.levelIndex + 1} пройден!`, CW/2, CH/2 + 122);
  ctx.font = 'bold 18px monospace';
  ctx.fillText('Нажми, чтобы продолжить', CW/2, CH/2 + 158);
}

function drawGameWin() {
  drawBackground();
  drawCastle(true);
  const t = performance.now() / 300;
  const jumpY = Math.abs(Math.sin(t)) * 20;
  const px = CW/2 - 40;
  const py = CH/2 + 30 - jumpY;
  const spr = SPRITE_CACHE.princessStand;
  ctx.drawImage(spr, px, py, 80, 80);

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(CW/2 - 280, CH/2 + 130, 560, 90);
  ctx.fillStyle = PAL.white;
  ctx.font = 'bold 30px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Принцесса спасена!', CW/2, CH/2 + 155);
  ctx.font = 'bold 22px monospace';
  ctx.fillText('Спасибо тебе, герой! 💖', CW/2, CH/2 + 190);
  ctx.font = 'bold 16px monospace';
  ctx.fillText('Нажми, чтобы сыграть снова', CW/2, CH/2 + 228);
}

/* =========================================================
   9. ГЛАВНЫЙ ЦИКЛ
   ========================================================= */

let lastTime = 0;
let accumulator = 0;
const STEP = 1 / 60;

function loop(t) {
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = t;
  let dt = (t - lastTime) / 1000;
  lastTime = t;
  if (dt > 0.1) dt = 0.1;
  accumulator += dt;
  while (accumulator >= STEP) {
    update(STEP);
    accumulator -= STEP;
  }
  render();
}

function update(dt) {
  game.timer += dt;

  if (game.state === 'playing') {
    updatePlayer(dt);
    updateParticles(dt);
    const L = currentGrid();
    const targetCam = player.x + player.w / 2 - CW / CONFIG.tileSize / 2;
    game.cameraX += (targetCam - game.cameraX) * Math.min(1, dt * 8);
    if (game.cameraX < 0) game.cameraX = 0;
    const maxCam = L.W - CW / CONFIG.tileSize;
    if (game.cameraX > maxCam) game.cameraX = maxCam;
  } else if (game.state === 'dead') {
    game.transitionTimer -= dt;
    player.vy += CONFIG.gravity * dt;
    player.y += player.vy * dt;
    if (game.transitionTimer <= 0) {
      game.lives--;
      if (game.lives <= 0) {
        game.state = 'title';
        game.keepIsBig = false;
        game.keepHasFire = false;
        startMusic('title');
      } else {
        game.bonusLevel = null;
        game.bonusReturn = null;
        game.keepIsBig = false;
        game.keepHasFire = false;
        resetPlayer(false);
        game.state = 'playing';
        if (game.level.isUnderground) startMusic('underground');
        else startMusic('ground');
      }
    }
  } else if (game.state === 'levelComplete') {
    updateFireworks(dt);
    updateParticles(dt);
    game.transitionTimer -= dt;
  } else if (game.state === 'gameWin') {
    updateFireworks(dt);
  }
}

function render() {
  ctx.clearRect(0, 0, CW, CH);
  if (game.state === 'title') { drawTitle(); return; }
  if (game.state === 'levelComplete') { drawLevelComplete(); return; }
  if (game.state === 'gameWin') { drawGameWin(); return; }

  drawBackground();
  drawLevel();
  const L = currentGrid();
  if (L.coins) for (const c of L.coins) drawCoin(c);
  if (L.items) for (const it of L.items) drawItem(it);
  if (L.enemies) for (const e of L.enemies) drawEnemy(e);
  for (const fb of player.fireballs) drawFireball(fb);
  if (!game.bonusLevel) drawFlag();
  drawPlayer();
  drawParticles();
  drawHUD();
  drawButtons();
}

/* ---- Старт ---- */

resize();

// Титульная музыка запускается при первом касании (fullscreen + audio)
let titleMusicStarted = false;

function ensureTitleMusic() {
  initAudio();
  if (!audioCtx) return;
  // Всегда запускаем титульную музыку, если мы на титульном экране
  if (game.state === 'title' && musicState.current !== 'title') {
    titleMusicStarted = true;
    startMusic('title');
  }
}
window.addEventListener('touchstart', ensureTitleMusic, { once: false, passive: true });
window.addEventListener('mousedown', ensureTitleMusic, { once: false });

// Сторожевой таймер: раз в 1 сек проверяет, что музыка на титульном экране играет
setInterval(() => {
  if (audioCtx && game.state === 'title' && musicState.current !== 'title' && !musicState.playing) {
    startMusic('title');
  }
}, 1000);

requestAnimationFrame(loop);

</script>
